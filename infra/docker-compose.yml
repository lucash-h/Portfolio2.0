services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-portfolio}
      - PORT=${PORT:-3000}
    restart: unless-stopped
    networks:
      - app
    # Do NOT expose ports directly to host; only Caddy talks to it
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Commented out for production; uncomment for local debugging
    # ports:
    #   - "5432:5432"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-:80}
    restart: unless-stopped
    networks:
      - app
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app:
    driver: bridge
