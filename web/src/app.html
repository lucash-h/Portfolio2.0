<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Set data-theme before first paint to avoid a flash of the wrong theme.
			// Storage can throw (private browsing, disabled storage) so every access
			// is wrapped; a failure here just falls back to the OS preference.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light' || stored === 'dark') {
						document.documentElement.setAttribute('data-theme', stored);
					}
				} catch (e) {
					/* storage unavailable; OS preference via prefers-color-scheme still applies */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
